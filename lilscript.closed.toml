# Compiler-owned delivery; no JavaScript post-minifier or export rewriting.
[policy]
version = 3

[policy.tactics]
# Permit one-time constant-table decoding for smaller downloads.
# Runtime reads must not acquire recurring reconstruction work.
startup-reconstruction = "on"
recurring-reconstruction = "off"
string-array-packing = "off"
[javascript]
priority = "size-first"
# Assumes unpatched platform builtins; disable when consumers replace them.
assume_pristine_builtins = true
# Remove debugLog instrumentation; ordinary print and host console effects remain.
strip_debug = true
# Callbacks handed to the host are only called, never constructed.
assume_unconstructed_callbacks = true

# Preserved effort setting. 13 favors size; 14/15 allow more expensive marginal searches.
[effort]
level = 13

# Optimize the delivered files for this codec, independently of raw/gzip objectives.
[objective]
codecs = "brotli"
[mangle]
identifiers = true
properties = true
pool_strings = true

# All runtime files and format bindings are written by the compiler.
[delivery]
mode = "single"
directory = "."
host_modules = "embed"
select = ["index"]
entry_names = "remark.closed.js"
[delivery.entries]
index = "src/index.lil"

[policy.resources]
logical_work = 8000000000

[execution]
jobs = 1
